<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรายงานความก้าวหน้า V.3 - สำนักทางหลวงที่ 18</title>
    <!-- ใช้ Tailwind CSS สำหรับจัดหน้าตาให้เป็นระดับองค์กร -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้า Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-blue-800">Highway WorkD V.3</h2>
            <p class="text-gray-600">สำนักทางหลวงที่ 18 สงขลา</p>
        </div>

        <form id="loginForm">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">อีเมลผู้ใช้งาน</label>
                <input type="email" id="email" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="admin@example.com">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">รหัสผ่าน</label>
                <input type="password" id="password" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" placeholder="********">
            </div>
            
            <div class="flex items-center justify-between">
                <button type="submit" id="loginBtn" class="bg-blue-600 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full transition duration-150">
                    เข้าสู่ระบบ
                </button>
            </div>
            <p id="errorMessage" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </form>
    </div>

    <script>
        // 1. ตั้งค่าการเชื่อมต่อ Supabase ด้วย URL และ Anon Key ของคุณ
        const SUPABASE_URL = 'https://xsitjazwsaprzcwnksyu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzaXRqYXp3c2Fwcnpjd25rc3l1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTc1NjMsImV4cCI6MjEwMjUzMzU2M30.XenCi59dbIR1aS0udfCOdu6nxJt6eWzTvoRDsLkZ2A8';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. ดักจับการกดปุ่มเข้าสู่ระบบ
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');

            // เปลี่ยนสถานะปุ่มขณะรอโหลด
            loginBtn.innerText = 'กำลังตรวจสอบ...';
            loginBtn.disabled = true;
            errorMessage.classList.add('hidden');

            try {
                // ส่งข้อมูลไปตรวจสอบกับระบบ Auth ของ Supabase
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                // 3. หากล็อกอินสำเร็จ ให้ดึงสิทธิ์ (Role) จากตาราง doh_profiles_v3
                const userId = data.user.id;
                const { data: profileData, error: profileError } = await supabase
                    .from('doh_profiles_v3')
                    .select('role, department_id')
                    .eq('id', userId)
                    .single();

                if (profileError) throw profileError;

                // แสดงผลลัพธ์ (สเตปต่อไปเราจะเปลี่ยนเป็นการเด้งไปหน้า Dashboard ของแต่ละสิทธิ์)
                alert(`เข้าสู่ระบบสำเร็จ!\nระดับสิทธิ์ของคุณคือ: ${profileData.role}`);
                
                // ตัวอย่างการเปลี่ยนหน้า
                // window.location.href = 'dashboard.html';

            } catch (err) {
                errorMessage.innerText = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง โปรดลองอีกครั้ง';
                errorMessage.classList.remove('hidden');
            } finally {
                // คืนสถานะปุ่มกลับมา
                loginBtn.innerText = 'เข้าสู่ระบบ';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
