<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - Highway WorkD V.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- แถบเมนูด้านบน (สาธารณะ) -->
    <nav class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold">Highway WorkD V.3</h1>
            <p class="text-xs text-blue-200">ระบบติดตามความก้าวหน้าโครงการ (ภาคประชาชน)</p>
        </div>
        <div id="authContainer">
            <!-- ปุ่มล็อกอินเจ้าหน้าที่ (ซ่อน/แสดง ตามสถานะ) -->
            <button id="openLoginBtn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-sm font-bold shadow border border-blue-500 transition">
                🔒 สำหรับเจ้าหน้าที่
            </button>
            <a href="dashboard.html" id="goToDashboardBtn" class="hidden bg-teal-500 hover:bg-teal-600 px-4 py-2 rounded text-sm font-bold shadow transition">
                ⚙️ จัดการข้อมูล (หลังบ้าน)
            </a>
        </div>
    </nav>

    <!-- พื้นที่แสดงกราฟสำหรับประชาชน -->
    <div class="flex-1 p-4 md:p-8 flex flex-col items-center">
        <div class="w-full max-w-6xl bg-white p-6 rounded-xl shadow-lg border border-gray-100 flex flex-col h-[75vh]">
            <div class="mb-4 text-center md:text-left">
                <h2 class="text-2xl font-black text-blue-800">ภาพรวมความก้าวหน้าโครงการ</h2>
                <p class="text-gray-500 text-sm">อัปเดตข้อมูลล่าสุดจากแขวงทางหลวง</p>
            </div>
            
            <div class="flex-1 w-full relative bg-gray-50 rounded-lg p-4 border border-gray-100">
                <canvas id="publicChart"></canvas>
                <div id="loadingText" class="absolute inset-0 flex items-center justify-center text-blue-500 font-bold">
                    ⏳ กำลังโหลดข้อมูล...
                </div>
                <div id="noDataText" class="hidden absolute inset-0 flex items-center justify-center text-gray-400 font-bold">
                    ไม่มีข้อมูลโครงการในระบบ
                </div>
            </div>
        </div>
    </div>

    <!-- หน้าต่าง Pop-up สำหรับเข้าสู่ระบบ (ซ่อนไว้เป็นค่าเริ่มต้น) -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md relative animate-fade-in-up">
            <button id="closeLoginBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">✕</button>
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black text-blue-800">เข้าสู่ระบบเจ้าหน้าที่</h2>
                <p class="text-gray-500 text-sm mt-1">Highway WorkD V.3</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">อีเมลผู้ใช้งาน</label>
                    <input type="email" id="email" required placeholder="example@doh.go.th" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">รหัสผ่าน</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-lg shadow mt-4 transition">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- JavaScript ทำงานเบื้องหลัง -->
    <!-- ========================================== -->
    <script>
        const SUPABASE_URL = 'https://xsitjazwsaprzcwnksyu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzaXRqYXp3c2Fwcnpjd25rc3l1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTc1NjMsImV4cCI6MjEwMjUzMzU2M30.XenCi59dbIR1aS0udfCOdu6nxJt6eWzTvoRDsLkZ2A8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginModal = document.getElementById('loginModal');
        const openLoginBtn = document.getElementById('openLoginBtn');
        const closeLoginBtn = document.getElementById('closeLoginBtn');
        const goToDashboardBtn = document.getElementById('goToDashboardBtn');
        const loginForm = document.getElementById('loginForm');
        let chartInstance = null;

        // 1. จัดการการเปิด-ปิดหน้าต่างล็อกอิน
        openLoginBtn.addEventListener('click', () => loginModal.classList.remove('hidden'));
        closeLoginBtn.addEventListener('click', () => loginModal.classList.add('hidden'));

        // 2. เช็คว่าล็อกอินอยู่แล้วหรือเปล่า? (เพื่อเปลี่ยนปุ่มด้านบนขวา)
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                openLoginBtn.classList.add('hidden');
                goToDashboardBtn.classList.remove('hidden'); // ถ้าล็อกอินแล้ว โชว์ปุ่มเข้าหลังบ้าน
            }
        }

        // 3. ระบบเข้าสู่ระบบ
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = 'กำลังตรวจสอบ...'; btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                alert('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
                btn.innerHTML = 'เข้าสู่ระบบ'; btn.disabled = false;
            } else {
                // ถ้าล็อกอินสำเร็จ ให้เด้งไปหน้า dashboard ทันที
                window.location.href = 'dashboard.html';
            }
        });

        // 4. วาดกราฟสำหรับประชาชน (ดึงข้อมูลทั้งหมดโดยไม่สนแผนก)
        async function loadPublicChart() {
            document.getElementById('loadingText').classList.remove('hidden');
            try {
                // ดึงข้อมูลทั้งหมดที่สถานะไม่ใช่ 'รอดำเนินการ' (จะได้เห็นแต่งานที่เดินหน้าแล้ว)
                const { data: projects, error } = await supabaseClient
                    .from('doh_projects_v3')
                    .select('contract_number, project_name, progress_percent');

                document.getElementById('loadingText').classList.add('hidden');

                if (error) throw error;
                if (!projects || projects.length === 0) {
                    document.getElementById('noDataText').classList.remove('hidden');
                    return;
                }

                // เรียงเลขสัญญาจากน้อยไปมาก
                projects.sort((a, b) => (a.contract_number || '').localeCompare(b.contract_number || '', 'th', { numeric: true }));

                const labels = projects.map(p => p.contract_number || 'ไม่ระบุ');
                const dataValues = projects.map(p => p.progress_percent || 0);
                // เก็บชื่อโครงการไว้แสดงตอนเอาเมาส์ชี้
                const projectNames = projects.map(p => p.project_name || '-');

                const ctx = document.getElementById('publicChart').getContext('2d');
                chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'ความก้าวหน้าสะสม (%)',
                            data: dataValues,
                            backgroundColor: 'rgba(13, 148, 136, 0.7)', 
                            borderColor: 'rgba(13, 148, 136, 1)',
                            borderWidth: 1,
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: true, max: 100, title: { display: true, text: 'ร้อยละ (%)' } },
                            x: { title: { display: true, text: 'เลขที่สัญญา' } }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    // เปลี่ยนข้อความใน Tooltip ให้แสดงชื่อโครงการด้วย
                                    title: function(context) {
                                        return 'สัญญา: ' + context[0].label;
                                    },
                                    afterTitle: function(context) {
                                        return projectNames[context[0].dataIndex]; // โชว์ชื่อโครงการ
                                    }
                                }
                            }
                        }
                    }
                });

            } catch (err) {
                document.getElementById('loadingText').innerHTML = '❌ เกิดข้อผิดพลาดในการดึงข้อมูล';
                console.error(err);
            }
        }

        // เริ่มทำงาน
        checkSession();
        loadPublicChart();
    </script>
</body>
</html>
