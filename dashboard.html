<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Highway WorkD V.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold">Highway WorkD V.3</h1>
        </div>
        <div class="flex items-center gap-4">
            <span id="userInfo" class="text-sm font-medium">กำลังโหลดข้อมูล...</span>
            <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-sm font-bold shadow transition duration-150">
                ออกจากระบบ
            </button>
        </div>
    </nav>

    <div class="container mx-auto p-6 mt-4">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">ระบบรายงานความก้าวหน้าโครงการ</h2>
                <button id="addProjectBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow hidden">
                    + เพิ่มโครงการใหม่
                </button>
            </div>
            
            <div id="projectContainer" class="border-dashed border-2 border-gray-300 p-12 text-center text-gray-500 rounded bg-gray-50">
                พื้นที่ตารางแสดงรายการโครงการก่อสร้าง (กำลังพัฒนา)
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xsitjazwsaprzcwnksyu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzaXRqYXp3c2Fwcnpjd25rc3l1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTc1NjMsImV4cCI6MjEwMjUzMzU2M30.XenCi59dbIR1aS0udfCOdu6nxJt6eWzTvoRDsLkZ2A8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            const user = session.user;

            const { data: profileData, error } = await supabaseClient
                .from('doh_profiles_v3')
                .select('role, department_id')
                .eq('id', user.id)
                .single();

            if (!error && profileData) {
                document.getElementById('userInfo').innerText = `ผู้ใช้งาน: ${user.email} (สิทธิ์: ${profileData.role})`;
                
                if (profileData.role === 'super_admin' || profileData.role === 'admin') {
                    document.getElementById('addProjectBtn').classList.remove('hidden');
                }

                // เรียกใช้ฟังก์ชันดึงข้อมูลตารางตรงนี้ครับ
                fetchProjects();
  
                // ส่วนของการแสดง Alert ต้อนรับ
                const savedRole = localStorage.getItem('loginSuccessRole');
                if (savedRole) {
                    alert(`เข้าสู่ระบบสำเร็จ!\nระดับสิทธิ์ของคุณคือ: ${savedRole}`);
                    localStorage.removeItem('loginSuccessRole'); // ลบค่าทิ้งเพื่อไม่ให้เด้งซ้ำตอนรีเฟรช
                }
            }
        }
// ฟังก์ชันดึงข้อมูลและสร้างตาราง
        async function fetchProjects() {
            const container = document.getElementById('projectContainer');
            container.innerHTML = '<p class="text-blue-500 font-bold">กำลังโหลดข้อมูลโครงการ...</p>';

            try {
                // คำสั่งเดียวดึงข้อมูลได้เลย (RLS ในฐานข้อมูลจะกรองสิทธิ์ให้เอง)
                const { data: projects, error } = await supabaseClient
                    .from('doh_projects_v3')
                    .select('*')
                    .order('id', { ascending: false }); // เรียงจากใหม่ไปเก่า

                if (error) throw error;

                // กรณีที่ยังไม่มีข้อมูลในระบบ
                if (!projects || projects.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">ยังไม่มีข้อมูลโครงการในระบบ</p>';
                    return;
                }

                // สร้างโครงสร้างตาราง HTML
                let tableHTML = `
                    <div class="overflow-x-auto text-left">
                        <table class="min-w-full bg-white border border-gray-200 shadow-sm rounded-lg overflow-hidden">
                            <thead class="bg-blue-50">
                                <tr>
                                    <th class="py-3 px-4 border-b text-gray-700 font-bold">รหัส</th>
                                    <th class="py-3 px-4 border-b text-gray-700 font-bold">ชื่อโครงการ</th>
                                    <th class="py-3 px-4 border-b text-gray-700 font-bold">เลขที่สัญญา</th>
                                    <th class="py-3 px-4 border-b text-gray-700 font-bold">สถานะ</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                // วนลูปนำข้อมูลแต่ละแถวมาใส่ในตาราง
                projects.forEach(project => {
                    tableHTML += `
                        <tr class="hover:bg-gray-50 transition duration-150">
                            <td class="py-2 px-4 border-b text-gray-600">${project.id}</td>
                            <td class="py-2 px-4 border-b text-gray-800 font-medium">${project.project_name || '-'}</td>
                            <td class="py-2 px-4 border-b text-gray-600">${project.contract_number || '-'}</td>
                            <td class="py-2 px-4 border-b">
                                <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs font-bold">
                                    ${project.status || 'รออัปเดต'}
                                </span>
                            </td>
                        </tr>
                    `;
                });

                tableHTML += `</tbody></table></div>`;
                
                // นำตารางไปแสดงในหน้าเว็บแทนที่กล่องข้อความเดิม
                container.innerHTML = tableHTML;
                container.classList.remove('border-dashed', 'border-2', 'p-12', 'text-center');

            } catch (err) {
                console.error("Fetch Error:", err);
                container.innerHTML = '<p class="text-red-500 font-bold">เกิดข้อผิดพลาดในการดึงข้อมูล โปรดลองรีเฟรชหน้าเว็บ</p>';
            }
        }
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        checkSession();
    </script>
</body>
</html>
