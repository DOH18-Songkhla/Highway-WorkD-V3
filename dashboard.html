<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Highway WorkD V.3</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen relative">

    <!-- แถบเมนูด้านบน (Navbar) -->
    <nav class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold">Highway WorkD V.3</h1>
        </div>
        <div class="flex items-center gap-4">
            <!-- แสดงชื่อและตำแหน่งที่มุมขวาบน -->
            <div id="userInfo" class="text-sm">กำลังโหลดข้อมูล...</div>
            <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-sm font-bold shadow transition duration-150">
                ออกจากระบบ
            </button>
        </div>
    </nav>

    <!-- พื้นที่แสดงเนื้อหาหลัก -->
    <div class="container mx-auto p-6 mt-4">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">ระบบรายงานความก้าวหน้าโครงการ</h2>
                <!-- ปุ่มเพิ่มโครงการจะแสดงเฉพาะสิทธิ์ที่เหมาะสมในอนาคต -->
                <button id="addProjectBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow hidden">
                    + เพิ่มโครงการใหม่
                </button>
            </div>
            
            <!-- พื้นที่สำหรับแสดงตารางข้อมูล (เดี๋ยวเรามาเขียนโค้ดดึงข้อมูลใส่ตรงนี้กันครับ) -->
            <div id="projectContainer" class="p-4 text-center text-gray-500 rounded bg-gray-50 border border-gray-200">
                กำลังโหลดข้อมูล...
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 1. หน้าต่าง Pop-up สำหรับเพิ่มโครงการ (V2 Style)    -->
    <!-- ========================================== -->
    <div id="projectModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-lg w-full max-w-5xl p-6 shadow-xl my-8">
            <h3 class="text-xl font-bold mb-4 text-purple-800 flex items-center gap-2">
                <span class="text-2xl">+</span> เพิ่มโครงการใหม่
            </h3>
            <form id="projectForm">
                <!-- แถวที่ 1 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">ชื่อโครงการ *</label>
                        <input type="text" id="projectName" required placeholder="ชื่อโครงการ" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">ปีงบประมาณ</label>
                        <input type="text" id="fiscalYear" placeholder="เช่น 2570" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">แหล่งทุน</label>
                        <input type="text" id="fundingSource" placeholder="เช่น งบประมาณแผ่นดิน" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <!-- แถวที่ 2 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">สถานะ</label>
                        <select id="projectStatus" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                            <option value="รอดำเนินการ">📌 รอดำเนินการ</option>
                            <option value="ระหว่างก่อสร้าง">🚧 ระหว่างก่อสร้าง</option>
                            <option value="รอส่งมอบงาน">📦 รอส่งมอบงาน</option>
                            <option value="รอเบิกจ่าย">💰 รอเบิกจ่าย</option>
                            <option value="ล่าช้ากว่าแผน">⚠️ ล่าช้ากว่าแผน</option>
                            <option value="แล้วเสร็จ">✅ แล้วเสร็จ</option>
                            <option value="บอกเลิกสัญญา">⛔ บอกเลิกสัญญา</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">เลขที่สัญญา</label>
                        <input type="text" id="contractNum" placeholder="เลขที่สัญญา" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">ผู้รับจ้าง</label>
                        <input type="text" id="contractor" placeholder="ชื่อผู้รับจ้าง" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <!-- แถวที่ 3 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">หมายเลขสายทาง</label>
                        <input type="text" id="routeNum" placeholder="เช่น ทล.4, ทล.401" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">ชื่อช่วงทาง</label>
                        <input type="text" id="sectionName" placeholder="ชื่อช่วง/ส่วนงาน" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">ช่วงกิโลเมตร</label>
                        <input type="text" id="kmRange" placeholder="เช่น กม.0+000 - กม.5+200" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <!-- แถวที่ 4 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">ความก้าวหน้า (%)</label>
                        <input type="number" id="progressPercent" value="0" min="0" max="100" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">งบประมาณทั้งหมด</label>
                        <input type="number" id="totalBudget" value="0.00" step="0.01" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">จ่ายเงินแล้ว</label>
                        <input type="number" id="paidAmount" value="0.00" step="0.01" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>
                <!-- คณะกรรมการตรวจรับพัสดุ / ผู้ควบคุมงาน -->
                <div class="mb-6 border-t pt-4">
                    <label class="block text-purple-800 text-md font-bold mb-2 flex items-center gap-2">
                        👥 คณะกรรมการตรวจรับพัสดุ / ผู้ควบคุมงาน
                    </label>
                    <div id="committeeContainer" class="space-y-2">
                        <!-- แถวรายชื่อคณะกรรมการจะถูกเพิ่มที่นี่อัตโนมัติ -->
                    </div>
                    <button type="button" id="addCommitteeBtn" class="mt-3 bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm shadow-sm border flex items-center gap-1 font-medium">
                        + เพิ่มรายชื่อ
                    </button>
                </div>
                
                <!-- ส่วนอัปโหลดรูปภาพ -->
                <div class="mb-6 border-t pt-4">
                    <label class="block text-purple-800 text-md font-bold mb-2 flex items-center gap-2">
                        📸 รูปภาพความก้าวหน้าหน้างาน (เลือกได้สูงสุด 4 รูป)
                    </label>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-gray-700 text-xs font-bold mb-1">รูปที่ 1</label>
                            <input type="file" id="photo1" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-xs font-bold mb-1">รูปที่ 2</label>
                            <input type="file" id="photo2" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-xs font-bold mb-1">รูปที่ 3</label>
                            <input type="file" id="photo3" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-xs font-bold mb-1">รูปที่ 4</label>
                            <input type="file" id="photo4" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                        </div>
                    </div>
                </div>
                
                <!-- หมายเหตุ -->
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-1">รายละเอียด / หมายเหตุ</label>
                    <textarea id="projectNotes" rows="3" placeholder="บันทึกรายละเอียด..." class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500"></textarea>
                </div>

                <!-- ปุ่มบันทึก/ยกเลิก -->
                <div class="flex justify-start gap-3 border-t pt-4">
                    <button type="submit" id="saveProjectBtn" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded flex items-center gap-2 font-bold shadow">
                        💾 บันทึก
                    </button>
                    <button type="button" id="closeModalBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded flex items-center gap-2 font-bold shadow">
                        ❌ ยกเลิก
                    </button>
                </div>
            </form>
        </div>
    </div>
                <!-- หน้าต่าง Pop-up (Modal) สำหรับดูรายละเอียดโครงการและรูปภาพ -->
    <div id="viewModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-xl w-full max-w-5xl p-6 shadow-2xl my-8 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-xl font-bold text-blue-900 flex items-center gap-2">
                    🔍 ดูรายละเอียดข้อมูลโครงการ
                </h3>
                <button type="button" id="closeViewModalBtn" class="text-gray-400 hover:text-red-500 font-bold text-2xl px-2">✕</button>
            </div>
            
            <div id="viewContent">
                <p class="text-center text-gray-500 py-10">⏳ กำลังโหลดข้อมูล...</p>
            </div>
        </div>
    </div>>

<script>
        // 1. ตั้งค่าการเชื่อมต่อ (ใช้ Key เดิมของคุณ)
        const SUPABASE_URL = 'https://xsitjazwsaprzcwnksyu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzaXRqYXp3c2Fwcnpjd25rc3l1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTc1NjMsImV4cCI6MjEwMjUzMzU2M30.XenCi59dbIR1aS0udfCOdu6nxJt6eWzTvoRDsLkZ2A8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let userDepartmentId = null; // ตัวแปรเก็บสังกัดของคนที่ล็อกอิน
        let userRole = null; // เก็บ Role ของผู้ใช้ปัจจุบัน
        
        // ตัวแปรสำหรับระบบแก้ไข (Edit System)
        let currentEditId = null; 
        let currentExistingPhotos = {}; 

        // 1. ตรวจสอบสิทธิ์ผู้ใช้งาน
        async function checkSession() {
            // ดึงข้อมูล session ปัจจุบัน
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            // ถ้าไม่มี session (ยังไม่ได้ล็อกอิน) ให้เตะกลับไปหน้า Login
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            const user = session.user;

            // ดึงข้อมูล Role จากตาราง doh_profiles_v3 พ่วง full_name และ position_name มาด้วย
            const { data: profileData, error } = await supabaseClient
                .from('doh_profiles_v3')
                .select('role, department_id, full_name, position_name')
                .eq('id', user.id)
                .single();

            if (!error && profileData) {
                userDepartmentId = profileData.department_id; // เก็บสังกัดไว้ใช้ตอนสร้างโครงการใหม่
                userRole = profileData.role; // เก็บค่า Role ไว้ใช้เช็คจุดแดงตอนแก้ไขข้อมูล

                // จัดรูปแบบชื่อและตำแหน่ง
                const name = profileData.full_name || user.email;
                const position = profileData.position_name || 'ไม่ระบุตำแหน่ง';
                
                document.getElementById('userInfo').innerHTML = `
                    <div class="text-right leading-tight">
                        <div class="font-bold text-white">${name}</div>
                        <div class="text-xs text-blue-200">${position} (สิทธิ์: ${profileData.role})</div>
                    </div>
                `;
                
                if (profileData.role === 'super_admin' || profileData.role === 'admin') {
                    document.getElementById('addProjectBtn').classList.remove('hidden');
                }
                // สั่งดึงข้อมูลโครงการมาแสดง
                fetchProjects();
            }
        }

        // 2. ดึงข้อมูลโครงการมาสร้างตาราง
        async function fetchProjects() {
            const container = document.getElementById('projectContainer');
            
            try {
                const { data: projects, error } = await supabaseClient
                    .from('doh_projects_v3')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!projects || projects.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 py-8">ยังไม่มีข้อมูลโครงการในระบบ</p>';
                    return;
                }

                let tableHTML = `
                    <div class="overflow-x-auto text-left">
                        <table class="min-w-full bg-white">
                            <thead class="bg-blue-50 border-b-2 border-blue-200">
                                <tr>
                                    <th class="py-3 px-4 text-gray-700 font-bold">เลขที่สัญญา</th>
                                    <th class="py-3 px-4 text-gray-700 font-bold">ชื่อโครงการ</th>
                                    <th class="py-3 px-4 text-gray-700 font-bold">สถานะ</th>
                                    <th class="py-3 px-4 text-gray-700 font-bold text-right">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                `;

                projects.forEach(project => {
                    // 1. เช็คสถานะแจ้งเตือนเพื่อสร้างจุดแดง
                    const redDot = project.has_new_update 
                        ? `<span class="inline-block w-3 h-3 bg-red-500 rounded-full mr-2 shadow-sm animate-pulse"></span>` 
                        : '';

                    // 2. จัดการสีของสถานะโครงการ
                    let statusColor = 'bg-gray-100 text-gray-800'; 
                    if(project.status === 'ระหว่างก่อสร้าง') statusColor = 'bg-yellow-100 text-yellow-800';
                    if(project.status === 'รอส่งมอบงาน') statusColor = 'bg-blue-100 text-blue-800';
                    if(project.status === 'รอเบิกจ่าย') statusColor = 'bg-purple-100 text-purple-800';
                    if(project.status === 'ล่าช้ากว่าแผน') statusColor = 'bg-orange-100 text-orange-800';
                    if(project.status === 'แล้วเสร็จ') statusColor = 'bg-green-100 text-green-800';
                    if(project.status === 'บอกเลิกสัญญา') statusColor = 'bg-red-600 text-white';

                    // เพิ่มปุ่ม ✏️ แก้ไข ตรงส่วนจัดการ
                    tableHTML += `
                        <tr class="hover:bg-gray-50 transition border-b">
                            <!-- คอลัมน์ 1: เลขที่สัญญา -->      
							<td class="py-3 px-4 text-gray-600">${project.contract_number || '-'}</td>
							<!-- คอลัมน์ 2: ชื่อโครงการ (และจุดแดงแจ้งเตือน) -->
                            <td class="py-3 px-4 text-gray-800 font-medium flex items-center">
                                ${redDot} ${project.project_name || '-'}
                            </td>
                            <!-- คอลัมน์ 3: สถานะ -->
                            <td class="py-3 px-4">
                                <span class="px-2 py-1 rounded text-xs font-bold ${statusColor}">
                                    ${project.status || 'ไม่มีข้อมูล'}
                                </span>
                            </td>
							<!-- คอลัมน์ 4: จัดการ -->
                            <td class="py-3 px-4 text-right space-x-1 whitespace-nowrap">
                                <button onclick="viewProject('${project.id}')" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-2.5 py-1.5 rounded text-xs font-semibold border border-blue-200 transition">
                                    🔍 ดู
                                </button>
                                <button onclick="editProject('${project.id}')" class="bg-amber-50 text-amber-600 hover:bg-amber-100 px-2.5 py-1.5 rounded text-xs font-semibold border border-amber-200 transition">
                                    ✏️ แก้ไข
                                </button>
                                <button onclick="deleteProject('${project.id}', '${project.project_name}')" class="bg-red-50 text-red-600 hover:bg-red-100 px-2.5 py-1.5 rounded text-xs font-semibold border border-red-200 transition">
                                    🗑️ ลบ
                                </button>
                            </td>
                        </tr>
                    `;
                });

                tableHTML += `</tbody></table></div>`;
                container.innerHTML = tableHTML;

            } catch (err) {
                console.error("Fetch Error:", err);
                container.innerHTML = '<p class="text-red-500 font-bold py-8">เกิดข้อผิดพลาดในการดึงข้อมูล โปรดลองรีเฟรชหน้าเว็บ</p>';
            }
        }

        // 3. จัดการ Modal ฟอร์ม (ใช้ร่วมกันระหว่าง เพิ่ม และ แก้ไข)
        const modal = document.getElementById('projectModal');
        const projectForm = document.getElementById('projectForm');
        const addProjectBtn = document.getElementById('addProjectBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
// ระบบจัดการรายชื่อคณะกรรมการ
		const committeeContainer = document.getElementById('committeeContainer');
        const addCommitteeBtn = document.getElementById('addCommitteeBtn');

        // ฟังก์ชันสร้างแถวคณะกรรมการ (ปรับให้รองรับการดึงข้อมูลเก่ามาโชว์)
        function addCommitteeRow(name = '', position = '', role = '') {
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-center committee-row';
            row.innerHTML = `
                <input type="text" placeholder="ชื่อ-นามสกุล" class="c-name shadow-sm border rounded w-full md:w-2/5 py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                <input type="text" placeholder="ตำแหน่ง" class="c-position shadow-sm border rounded w-full md:w-2/5 py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                <select class="c-role shadow-sm border rounded w-full md:w-1/5 py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    <option value="">-- เลือกประเภท --</option>
                    <option value="ประธานคณะกรรมการ">ประธานคณะกรรมการ</option>
                    <option value="กรรมการ">กรรมการ</option>
                    <option value="ผู้ควบคุมงาน">ผู้ควบคุมงาน</option>
                    <option value="ผู้ช่วยผู้ควบคุมงาน">ผู้ช่วยควบคุมงาน</option>
                </select>
                <button type="button" class="text-red-400 hover:text-red-600 font-bold px-2 text-xl remove-c-btn">✕</button>
            `;
            committeeContainer.appendChild(row);

            // ใส่ข้อมูลเก่าลงไปในช่อง
            row.querySelector('.c-name').value = name;
            row.querySelector('.c-position').value = position;
            row.querySelector('.c-role').value = role;
            // คำสั่งลบแถวเมื่อกดปุ่มกากบาท
            row.querySelector('.remove-c-btn').addEventListener('click', function() {
                row.remove();
            });
        }
        addCommitteeBtn.addEventListener('click', () => addCommitteeRow());

        // ปุ่มปิด Modal
        closeModalBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        // 🟢 1. กดปุ่ม "เพิ่มโครงการใหม่" (โหมด Add)
        addProjectBtn.addEventListener('click', () => {
            currentEditId = null; // รีเซ็ตสถานะเป็น "สร้างใหม่"
            currentExistingPhotos = {};
            
            // เปลี่ยนหัวข้อและปุ่มให้เป็นโหมดสร้าง
            document.querySelector('#projectModal h3').innerHTML = '<span class="text-2xl">+</span> เพิ่มโครงการใหม่';
            document.getElementById('saveProjectBtn').innerHTML = '💾 บันทึก';
            
            projectForm.reset();
            committeeContainer.innerHTML = ''; 
            addCommitteeRow(); 
            modal.classList.remove('hidden');
        });

        // 🟠 2. กดปุ่ม "แก้ไข" ในตาราง (โหมด Edit)
        async function editProject(projectId) {
            currentEditId = projectId; // บันทึก ID ที่กำลังจะแก้

            // เปลี่ยนหัวข้อและปุ่มให้เป็นโหมดแก้ไข
            document.querySelector('#projectModal h3').innerHTML = '<span class="text-2xl">✏️</span> แก้ไขข้อมูลโครงการ';
            document.getElementById('saveProjectBtn').innerHTML = '💾 บันทึกการแก้ไข';
            
            try {
                // ดึงข้อมูลโครงการจากฐานข้อมูล
                const { data: project, error } = await supabaseClient.from('doh_projects_v3').select('*').eq('id', projectId).single();
                if (error) throw error;

                // หยอดข้อมูลลงในฟอร์ม
                document.getElementById('projectName').value = project.project_name || '';
                document.getElementById('fiscalYear').value = project.fiscal_year || '';
                document.getElementById('fundingSource').value = project.funding_source || '';
                document.getElementById('projectStatus').value = project.status || 'รอดำเนินการ';
                document.getElementById('contractNum').value = project.contract_number || '';
                document.getElementById('contractor').value = project.contractor || '';
                document.getElementById('routeNum').value = project.route_number || '';
                document.getElementById('sectionName').value = project.section_name || '';
                document.getElementById('kmRange').value = project.km_range || '';
                document.getElementById('progressPercent').value = project.progress_percent || 0;
                document.getElementById('totalBudget').value = project.total_budget || 0;
                document.getElementById('paidAmount').value = project.paid_amount || 0;
                document.getElementById('projectNotes').value = project.notes || '';

                // หยอดข้อมูลคณะกรรมการ
                committeeContainer.innerHTML = '';
                if (project.committee_members && project.committee_members.length > 0) {
                    project.committee_members.forEach(c => addCommitteeRow(c.name, c.position, c.role));
                } else {
                    addCommitteeRow();
                }

                // สำรองข้อมูลรูปรถเก็บไว้ (เผื่ออัปเดตแบบไม่ได้แนบรูปใหม่)
                currentExistingPhotos = {
                    photo_1: project.photo_1,
                    photo_2: project.photo_2,
                    photo_3: project.photo_3,
                    photo_4: project.photo_4
                };

                modal.classList.remove('hidden');
            } catch (err) {
                alert('โหลดข้อมูลล้มเหลว: ' + err.message);
            }
        }

        // 4. ฟังก์ชันอัปโหลดรูปลง Supabase Storage
        async function uploadImage(fileInputId) {
            const fileInput = document.getElementById(fileInputId);
            const file = fileInput.files[0];
            if (!file) return null; // ถ้าไม่ได้เลือกรูป ให้ข้ามไป
            // สร้างชื่อไฟล์ใหม่ไม่ให้ซ้ำกัน (ใช้เวลาปัจจุบัน + สุ่มตัวอักษร)
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            const filePath = `progress/${fileName}`; // เก็บในโฟลเดอร์ชื่อ progress

            try {
                // 1. อัปโหลดไฟล์ไปที่ Bucket 'project_photos'
                const { error: uploadError } = await supabaseClient.storage.from('project_photos').upload(filePath, file);
                if (uploadError) throw uploadError;
                // 2. ดึง URL แบบ Public ของรูปที่เพิ่งอัปโหลดเสร็จ
                const { data } = supabaseClient.storage.from('project_photos').getPublicUrl(filePath);
                return data.publicUrl;
            } catch (err) {
                return null;
            }
        }
        
        // 5. 💾 ฟังก์ชันกดบันทึก (รับมือได้ทั้ง สร้างใหม่ และ อัปเดต)
        projectForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('saveProjectBtn');
            saveBtn.innerHTML = '⏳ กำลังประมวลผล...';
            saveBtn.disabled = true;

            try {
                // --- ส่วนที่ 1: อัปโหลดรูปภาพทั้งหมด ถ้าไม่ได้เลือกไฟล์รูปใหม่มา ให้ใช้รูปเก่า (currentExistingPhotos) หรือถ้าสร้างใหม่จะกลายเป็น null
                const photo1Url = await uploadImage('photo1') || currentExistingPhotos.photo_1 || null;
                const photo2Url = await uploadImage('photo2') || currentExistingPhotos.photo_2 || null;
                const photo3Url = await uploadImage('photo3') || currentExistingPhotos.photo_3 || null;
                const photo4Url = await uploadImage('photo4') || currentExistingPhotos.photo_4 || null;
                // --- ส่วนที่ 2: กวาดข้อมูลคณะกรรมการ ---
                const committeeRows = document.querySelectorAll('.committee-row');
                const committeeMembers = [];
                committeeRows.forEach(row => {
                    const name = row.querySelector('.c-name').value.trim();
                    const position = row.querySelector('.c-position').value.trim();
                    const role = row.querySelector('.c-role').value;
                    if (name) committeeMembers.push({ name, position, role });
                });
                // --- ส่วนที่ 3: รวมข้อมูลทั้งหมดส่งเข้าฐานข้อมูล ---
                const projectData = {
                    project_name: document.getElementById('projectName').value,
                    fiscal_year: document.getElementById('fiscalYear').value,
                    funding_source: document.getElementById('fundingSource').value,
                    status: document.getElementById('projectStatus').value,
                    contract_number: document.getElementById('contractNum').value,
                    contractor: document.getElementById('contractor').value,
                    route_number: document.getElementById('routeNum').value,
                    section_name: document.getElementById('sectionName').value,
                    km_range: document.getElementById('kmRange').value,
                    progress_percent: parseFloat(document.getElementById('progressPercent').value) || 0,
                    total_budget: parseFloat(document.getElementById('totalBudget').value) || 0,
                    paid_amount: parseFloat(document.getElementById('paidAmount').value) || 0,
                    notes: document.getElementById('projectNotes').value,
                    department_id: userDepartmentId,
                    committee_members: committeeMembers,
                    // ใส่ URL รูปภาพที่ได้มาลงฐานข้อมูล (ถ้าไม่ได้อัปโหลดจะเป็น null)
                    photo_1: photo1Url,
                    photo_2: photo2Url,
                    photo_3: photo3Url,
                    photo_4: photo4Url
                };

                if (currentEditId) {
                    // โหมดแก้ไข (Update)
                    // ถ้า admin หรือผู้รับผิดชอบเป็นคนแก้ ให้โชว์จุดแดงแจ้งเตือน แต่ถ้าคุณ (super_admin) เป็นคนแก้ ให้จุดแดงดับ
                    projectData.has_new_update = (userRole !== 'super_admin'); 

                    const { error } = await supabaseClient.from('doh_projects_v3').update(projectData).eq('id', currentEditId);
                    if (error) throw error;
                    alert('✅ อัปเดตข้อมูลสำเร็จ!');
                } else {
                    // โหมดสร้างใหม่ (Insert)
                    projectData.has_new_update = true; // สร้างใหม่ให้แจ้งเตือนด้วย
                    const { error } = await supabaseClient.from('doh_projects_v3').insert([projectData]);
                    if (error) throw error;
                    alert('✅ เพิ่มโครงการใหม่สำเร็จ!');
                }

                modal.classList.add('hidden');
                projectForm.reset();
                fetchProjects();

            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
            } finally {
                saveBtn.innerHTML = currentEditId ? '💾 บันทึกการแก้ไข' : '💾 บันทึก';
                saveBtn.disabled = false;
            }
        });

        // 6. 🔴 ออกจากระบบ
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        // 7. 🔍 ดูรายละเอียด และ 🗑️ ลบ (ใช้โค้ดเดิมที่ใช้งานได้ดีแล้ว)
        const viewModal = document.getElementById('viewModal');
        const viewContent = document.getElementById('viewContent');
        const closeViewModalBtn = document.getElementById('closeViewModalBtn');

        if (closeViewModalBtn) {
            closeViewModalBtn.addEventListener('click', () => {
                viewModal.classList.add('hidden');
            });
        }

        async function viewProject(projectId) {
            viewModal.classList.remove('hidden');
            viewContent.innerHTML = '<p class="text-center text-gray-500 py-12">⏳ กำลังดึงข้อมูล...</p>';

            try {
                const { data: project, error } = await supabaseClient
                    .from('doh_projects_v3')
                    .select('*')
                    .eq('id', projectId)
                    .single();

                if (error) throw error;

                // เคลียร์จุดแดงแจ้งเตือนทันทีที่เปิดดู
                if (project.has_new_update && userRole === 'super_admin') {
                    await supabaseClient
                        .from('doh_projects_v3')
                        .update({ has_new_update: false })
                        .eq('id', projectId);
                    fetchProjects(); // สั่งรีเฟรชตารางหลังบ้านให้จุดแดงดับ
                }

                // จัดการตารางรายชื่อคณะกรรมการ
                let committeeHTML = '<p class="text-sm text-gray-400">ไม่มีข้อมูลคณะกรรมการ</p>';
                if (project.committee_members && project.committee_members.length > 0) {
                    committeeHTML = `
                        <div class="overflow-x-auto border rounded-lg">
                            <table class="min-w-full text-xs text-left bg-gray-50">
                                <thead class="bg-gray-100 border-b text-gray-600">
                                    <tr>
                                        <th class="py-2 px-3">ชื่อ-นามสกุล</th>
                                        <th class="py-2 px-3">ตำแหน่ง</th>
                                        <th class="py-2 px-3">หน้าที่รับผิดชอบ</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y bg-white">
                    `;
                    project.committee_members.forEach(c => {
                        committeeHTML += `
                            <tr>
                                <td class="py-2 px-3 font-medium text-gray-800">${c.name || '-'}</td>
                                <td class="py-2 px-3 text-gray-600">${c.position || '-'}</td>
                                <td class="py-2 px-3 text-blue-700 font-semibold">${c.role || '-'}</td>
                            </tr>
                        `;
                    });
                    committeeHTML += `</tbody></table></div>`;
                }

                // จัดการรูปภาพ 4 รูป
                const photos = [
                    { title: "รูปที่ 1", url: project.photo_1 },
                    { title: "รูปที่ 2", url: project.photo_2 },
                    { title: "รูปที่ 3", url: project.photo_3 },
                    { title: "รูปที่ 4", url: project.photo_4 }
                ];
                let photosHTML = '';
                photos.forEach((item, index) => {
                    if (item.url) {
                        photosHTML += `
                            <div class="border rounded-lg overflow-hidden shadow-sm bg-white">
                                <a href="${item.url}" target="_blank" title="คลิกเพื่อดูรูปใหญ่">
                                    <img src="${item.url}" class="w-full h-44 object-cover hover:scale-105 transition duration-200">
                                </a>
                                <div class="p-2 text-center text-xs font-semibold text-gray-600 bg-gray-50 border-t">
                                    ${item.title}
                                </div>
                            </div>
                        `;
                    } else {
                        photosHTML += `
                            <div class="border-2 border-dashed border-gray-200 rounded-lg h-44 flex flex-col items-center justify-center text-gray-400 bg-gray-50">
                                <span class="text-2xl mb-1">�</span>
                                <span class="text-xs">ไม่มีรูปที่ ${index + 1}</span>
                            </div>
                        `;
                    }
                });
                // วาดเนื้อหาลงใน Modal
                viewContent.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-blue-50/50 p-4 rounded-lg border border-blue-100 mb-6">
                        <div>
                            <span class="text-xs text-gray-500 font-bold mt-2 block">เลขที่สัญญา</span>
                            <p class="text-sm text-gray-800">${project.contract_number || '-'}</p>
                            <span class="text-xs text-gray-500 font-bold">ชื่อโครงการ</span>
                            <p class="text-sm font-semibold text-gray-900">${project.project_name || '-'}</p>
                        </div>
                        <div>
                            <span class="text-xs text-gray-500 font-bold">ผู้รับจ้าง</span>
                            <p class="text-sm text-gray-800">${project.contractor || '-'}</p>
                            <span class="text-xs text-gray-500 font-bold mt-2 block">สายทาง / ช่วงควบคุม</span>
                            <p class="text-sm text-gray-800">${project.route_number || '-'} ${project.section_name || ''} (${project.km_range || '-'})</p>
                        </div>
                        <div>
                            <span class="text-xs text-gray-500 font-bold">ปีงบประมาณ / แหล่งทุน</span>
                            <p class="text-sm text-gray-800">${project.fiscal_year || '-'} (${project.funding_source || '-'})</p>
                            <span class="text-xs text-gray-500 font-bold mt-2 block">สถานะปัจจุบัน</span>
                            <span class="inline-block mt-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-white border shadow-sm">
                                ${project.status || '-'}
                            </span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div class="bg-teal-50 border border-teal-100 rounded-lg p-3 text-center">
                            <span class="text-xs font-bold text-teal-800">ความก้าวหน้าโครงการ</span>
                            <div class="text-2xl font-black text-teal-600 mt-1">${project.progress_percent || 0}%</div>
                        </div>
                        <div class="bg-purple-50 border border-purple-100 rounded-lg p-3 text-center">
                            <span class="text-xs font-bold text-purple-800">งบประมาณทั้งหมด</span>
                            <div class="text-xl font-bold text-purple-700 mt-1">${Number(project.total_budget || 0).toLocaleString()} ฿</div>
                        </div>
                        <div class="bg-amber-50 border border-amber-100 rounded-lg p-3 text-center">
                            <span class="text-xs font-bold text-amber-800">เบิกจ่ายแล้ว</span>
                            <div class="text-xl font-bold text-amber-700 mt-1">${Number(project.paid_amount || 0).toLocaleString()} ฿</div>
                        </div>
                    </div>

                    <div class="mb-6">
                        <h4 class="font-bold text-sm text-gray-700 mb-2 flex items-center gap-1.5">
                            👥 คณะกรรมการตรวจรับพัสดุ / ผู้ควบคุมงาน
                        </h4>
                        ${committeeHTML}
                    </div>

                    <div class="mb-6 bg-yellow-50/60 p-3 rounded-lg border border-yellow-100">
                        <h4 class="font-bold text-xs text-yellow-800 mb-1">📝 รายละเอียด / หมายเหตุ</h4>
                        <p class="text-sm text-gray-700 whitespace-pre-line">${project.notes || 'ไม่มีบันทึกเพิ่มเติม'}</p>
                    </div>

                    <div>
                        <h4 class="font-bold text-sm text-gray-700 mb-3 flex items-center gap-1.5">
                            📸 รูปภาพความก้าวหน้าหน้างาน
                        </h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            ${photosHTML}
                        </div>
                    </div>
                `;

            } catch (err) {
                viewContent.innerHTML = `<p class="text-red-500 text-center py-8">เกิดข้อผิดพลาด: ${err.message}</p>`;
            }
        }

        // ==========================================
        // 2. ฟังก์ชันลบโครงการ (Delete Project)
        // ==========================================
        async function deleteProject(projectId, projectName) {
            if (!confirm(`⚠️ คุณแน่ใจหรือไม่ว่าต้องการลบโครงการ:\n"${projectName}"`)) return;
            try {
                const { error } = await supabaseClient.from('doh_projects_v3').delete().eq('id', projectId);
                if (error) throw error;
                alert('🗑️ ลบโครงการเรียบร้อยแล้ว');
                fetchProjects(); 
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการลบ: ' + err.message);
            }
        }

        checkSession();
    </script>
</body>
</html>
