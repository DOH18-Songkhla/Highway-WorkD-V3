<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Highway WorkD V.3</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen relative">

    <!-- แถบเมนูด้านบน (Navbar) -->
    <nav class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold">Highway WorkD V.3</h1>
        </div>
        <div class="flex items-center gap-4">
            <div id="userInfo" class="text-sm">กำลังโหลดข้อมูล...</div>
            <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-sm font-bold shadow transition duration-150">
                ออกจากระบบ
            </button>
        </div>
    </nav>

    <!-- พื้นที่แสดงเนื้อหาหลัก -->
    <div class="container mx-auto p-6 mt-4">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-gray-800">ระบบรายงานความก้าวหน้าโครงการ</h2>
                <button id="addProjectBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow hidden">
                    + เพิ่มโครงการใหม่
                </button>
            </div>

            <!-- 📌 พื้นที่สำหรับ แท็บปีงบประมาณ พ.ศ. -->
            <div id="yearTabsContainer" class="flex gap-2 mb-4 overflow-x-auto pb-2 scrollbar-hide"></div>

            <div id="projectContainer" class="p-4 text-center text-gray-500 rounded bg-gray-50 border border-gray-200">
                กำลังโหลดข้อมูล...
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- หน้าต่าง Pop-up สำหรับเพิ่ม/แก้ไขโครงการ -->
    <!-- ============================================ -->
    <div id="projectModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-lg w-full max-w-5xl p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-xl font-bold mb-4 text-purple-800 flex items-center gap-2">
                <span class="text-2xl">+</span> เพิ่มโครงการใหม่
            </h3>
            
            <form id="projectForm">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">ชื่อโครงการ *</label>
                        <input type="text" id="projectName" required placeholder="ชื่อโครงการ" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">ปีงบประมาณ</label>
                        <input type="text" id="fiscalYear" placeholder="เช่น 2570" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">แหล่งทุน</label>
                        <input type="text" id="fundingSource" placeholder="เช่น งบประมาณแผ่นดิน" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">สถานะ</label>
                        <select id="projectStatus" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                            <option value="รอดำเนินการ">📌 รอดำเนินการ</option>
                            <option value="ระหว่างก่อสร้าง">🚧 ระหว่างก่อสร้าง</option>
                            <option value="รอส่งมอบงาน">📦 รอส่งมอบงาน</option>
                            <option value="รอเบิกจ่าย">💰 รอเบิกจ่าย</option>
                            <option value="ล่าช้ากว่าแผน">⚠️ ล่าช้ากว่าแผน</option>
                            <option value="แล้วเสร็จ">✅ แล้วเสร็จ</option>
                            <option value="บอกเลิกสัญญา">⛔ บอกเลิกสัญญา</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">เลขที่สัญญา</label>
                        <input type="text" id="contractNum" placeholder="เลขที่สัญญา" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">ผู้รับจ้าง</label>
                        <input type="text" id="contractor" placeholder="ชื่อผู้รับจ้าง" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">หมายเลขสายทาง</label>
                        <input type="text" id="routeNum" placeholder="เช่น ทล.4, ทล.401" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">ชื่อช่วงทาง</label>
                        <input type="text" id="sectionName" placeholder="ชื่อช่วง/ส่วนงาน" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">ช่วงกิโลเมตร</label>
                        <input type="text" id="kmRange" placeholder="เช่น กม.0+000 - กม.5+200" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <div>
                        <label class="block text-blue-800 text-sm font-bold mb-1">แผนงาน (%)</label>
                        <input type="number" id="planPercent" value="0" min="0" max="100" step="0.01" class="shadow-sm border rounded w-full py-2 px-3 text-blue-700 font-bold focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-orange-800 text-sm font-bold mb-1">ผลงานเดือนนี้ (%)</label>
                        <input type="number" id="actualPercent" value="0" min="0" max="100" step="0.01" class="shadow-sm border rounded w-full py-2 px-3 text-orange-700 font-bold focus:ring-2 focus:ring-orange-500">
                    </div>
                    <div>
                        <label class="block text-teal-800 text-sm font-bold mb-1">ผลงานสะสม (%)</label>
                        <input type="number" id="progressPercent" value="0" min="0" max="100" step="0.01" class="shadow-sm border rounded w-full py-2 px-3 text-teal-700 font-bold focus:ring-2 focus:ring-teal-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">งบประมาณทั้งหมด</label>
                        <input type="number" id="totalBudget" value="0.00" step="0.01" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">เบิกจ่ายแล้ว</label>
                        <input type="number" id="paidAmount" value="0.00" step="0.01" class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <div class="mb-6 border-t pt-4">
                    <label class="block text-purple-800 text-md font-bold mb-2 flex items-center gap-2">
                        👥 คณะกรรมการตรวจรับพัสดุ / ผู้ควบคุมงาน
                    </label>
                    <div id="committeeContainer" class="space-y-2"></div>
                    <button type="button" id="addCommitteeBtn" class="mt-3 bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm shadow-sm border flex items-center gap-1 font-medium">
                        + เพิ่มรายชื่อ
                    </button>
                </div>
                
                <div class="mb-6 border-t pt-4">
                    <label class="block text-purple-800 text-md font-bold mb-2 flex items-center gap-2">
                        📸 รูปภาพความก้าวหน้าหน้างาน (เลือกได้สูงสุด 4 รูป)
                    </label>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div><label class="block text-gray-700 text-xs font-bold mb-1">รูปที่ 1</label><input type="file" id="photo1" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-purple-50 file:text-purple-700"></div>
                        <div><label class="block text-gray-700 text-xs font-bold mb-1">รูปที่ 2</label><input type="file" id="photo2" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-purple-50 file:text-purple-700"></div>
                        <div><label class="block text-gray-700 text-xs font-bold mb-1">รูปที่ 3</label><input type="file" id="photo3" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-purple-50 file:text-purple-700"></div>
                        <div><label class="block text-gray-700 text-xs font-bold mb-1">รูปที่ 4</label><input type="file" id="photo4" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-purple-50 file:text-purple-700"></div>
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-1">รายละเอียด / หมายเหตุ</label>
                    <textarea id="projectNotes" rows="3" placeholder="บันทึกรายละเอียด..." class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 focus:ring-2 focus:ring-purple-500"></textarea>
                </div>

                <div class="flex justify-start gap-3 border-t pt-4">
                    <button type="submit" id="saveProjectBtn" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded flex items-center gap-2 font-bold shadow">💾 บันทึก</button>
                    <button type="button" id="closeModalBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded flex items-center gap-2 font-bold shadow">❌ ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- =================================================== -->
    <!-- หน้าต่าง Pop-up สำหรับดูรายละเอียดโครงการ (View Modal) -->
    <!-- =================================================== -->
    <div id="viewModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-xl w-full max-w-5xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-xl font-bold text-blue-900 flex items-center gap-2">🔍 ดูรายละเอียดข้อมูลโครงการ</h3>
                <button type="button" id="closeViewModalBtn" class="text-gray-400 hover:text-red-500 font-bold text-2xl px-2">✕</button>
            </div>
            <div id="viewContent"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xsitjazwsaprzcwnksyu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzaXRqYXp3c2Fwcnpjd25rc3l1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTc1NjMsImV4cCI6MjEwMjUzMzU2M30.XenCi59dbIR1aS0udfCOdu6nxJt6eWzTvoRDsLkZ2A8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let userDepartmentId = null;
        let userRole = null;
        let currentEditId = null; 
        let currentExistingPhotos = {}; 
        let allProjectsData = [];
        let currentYearTab = 'ทั้งหมด';

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();            
            if (!session) {window.location.href = 'index.html'; return;}
            
            const user = session.user;
            const { data: profileData } = await supabaseClient.from('doh_profiles_v3').select('*').eq('id', user.id).single();

            if (profileData) {
                userDepartmentId = profileData.department_id;
                userRole = profileData.role;
                document.getElementById('userInfo').innerHTML = `
                    <div class="text-right leading-tight">
                        <div class="font-bold text-white">${profileData.full_name || user.email}</div>
                        <div class="text-xs text-blue-200">${profileData.position_name || '-'} (สิทธิ์: ${profileData.role})</div>
                    </div>`;                
                if (profileData.role === 'super_admin' || profileData.role === 'admin') {
                    document.getElementById('addProjectBtn').classList.remove('hidden');
                }
                fetchProjects();
            }
        }

        async function fetchProjects() {
            const container = document.getElementById('projectContainer');
            try {
                const { data: projects, error } = await supabaseClient.from('doh_projects_v3').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                
                allProjectsData = projects || [];
                renderYearTabs();
                renderTable();
            } catch (err) {
                container.innerHTML = '<p class="text-red-500 font-bold py-8">เกิดข้อผิดพลาดในการดึงข้อมูล โปรดลองรีเฟรชหน้าเว็บ</p>';
            }
        }

        function renderYearTabs() {
            const tabsContainer = document.getElementById('yearTabsContainer');
            const years = [...new Set(allProjectsData.map(p => p.fiscal_year).filter(y => y))].sort((a, b) => b - a);
            
            let tabsHTML = `<button onclick="filterByYear('ทั้งหมด')" class="px-5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition border ${currentYearTab === 'ทั้งหมด' ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-gray-600 hover:bg-blue-50'}">ทั้งหมด</button>`;
            
            years.forEach(year => {
                tabsHTML += `<button onclick="filterByYear('${year}')" class="px-5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition border ${currentYearTab === year ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-gray-600 hover:bg-blue-50'}">ปี พ.ศ. ${year}</button>`;
            });
            tabsContainer.innerHTML = tabsHTML;
        }

        function filterByYear(year) {
            currentYearTab = year;
            renderYearTabs(); 
            renderTable(); 
        }

        function renderTable() {
            const container = document.getElementById('projectContainer');
            let displayProjects = allProjectsData;

            if (currentYearTab !== 'ทั้งหมด') {
                displayProjects = displayProjects.filter(p => p.fiscal_year === currentYearTab);
            }

            if (displayProjects.length === 0) {
                container.innerHTML = `<p class="text-gray-500 py-8">ไม่มีข้อมูลโครงการในปีงบประมาณ ${currentYearTab !== 'ทั้งหมด' ? currentYearTab : ''}</p>`;
                return;
            }

            let tableHTML = `
                <div class="overflow-x-auto text-left">
                    <table class="min-w-full bg-white">
                        <thead class="bg-blue-50 border-b-2 border-blue-200">
                            <tr>
                                <th class="py-3 px-4 text-gray-700 font-bold">เลขที่สัญญา</th>
                                <th class="py-3 px-4 text-gray-700 font-bold">ชื่อโครงการ</th>
                                <th class="py-3 px-4 text-gray-700 font-bold">ความก้าวหน้า</th>
                                <th class="py-3 px-4 text-gray-700 font-bold">สถานะ</th>
                                <th class="py-3 px-4 text-gray-700 font-bold text-right">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
            `;

            displayProjects.forEach(project => {
                const redDot = project.has_new_update 
                    ? `<span class="inline-block w-4 h-4 bg-red-500 rounded-full mr-2 flex-shrink-0 shadow-sm animate-pulse"></span>` : '';

                let statusColor = 'bg-gray-100 text-gray-800'; 
                if(project.status === 'ระหว่างก่อสร้าง') statusColor = 'bg-yellow-100 text-yellow-800';
                if(project.status === 'รอส่งมอบงาน') statusColor = 'bg-blue-100 text-blue-800';
                if(project.status === 'รอเบิกจ่าย') statusColor = 'bg-purple-100 text-purple-800';
                if(project.status === 'ล่าช้ากว่าแผน') statusColor = 'bg-orange-100 text-orange-800';
                if(project.status === 'แล้วเสร็จ') statusColor = 'bg-green-100 text-green-800';
                if(project.status === 'บอกเลิกสัญญา') statusColor = 'bg-red-600 text-white';

                const progressVal = project.progress_percent || 0;
                const progressBarHTML = `
                    <div class="flex items-center gap-2 w-full min-w-[120px]">
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-teal-500 h-2 rounded-full" style="width: ${progressVal}%"></div>
                        </div>
                        <span class="text-xs font-bold text-teal-700">${progressVal}%</span>
                    </div>
                `;

                tableHTML += `
                    <tr class="hover:bg-gray-50 transition border-b">
                        <td class="py-3 px-4 text-gray-600">${project.contract_number || '-'}</td>
                        <td class="py-3 px-4 text-gray-800 font-medium flex items-center">
                            ${redDot} ${project.project_name || '-'}
                        </td>
                        <td class="py-3 px-4">${progressBarHTML}</td>
                        <td class="py-3 px-4"><span class="px-2 py-1 rounded text-xs font-bold ${statusColor}">${project.status || 'ไม่มีข้อมูล'}</span></td>
                        <td class="py-3 px-4 text-right space-x-1 whitespace-nowrap">
                            <button onclick="viewProject('${project.id}')" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-2.5 py-1.5 rounded text-xs font-semibold border transition">🔍 ดู</button>
                            <button onclick="editProject('${project.id}')" class="bg-amber-50 text-amber-600 hover:bg-amber-100 px-2.5 py-1.5 rounded text-xs font-semibold border transition">✏️ แก้ไข</button>
                            <button onclick="deleteProject('${project.id}', '${project.project_name}')" class="bg-red-50 text-red-600 hover:bg-red-100 px-2.5 py-1.5 rounded text-xs font-semibold border transition">🗑️ ลบ</button>
                        </td>
                    </tr>
                `;
            });

            tableHTML += `</tbody></table></div>`;
            container.innerHTML = tableHTML;
        }

        const modal = document.getElementById('projectModal');
        const projectForm = document.getElementById('projectForm');
        const addProjectBtn = document.getElementById('addProjectBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const committeeContainer = document.getElementById('committeeContainer');
        const addCommitteeBtn = document.getElementById('addCommitteeBtn');

        function addCommitteeRow(name = '', position = '', role = '') {
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-center committee-row';
            row.innerHTML = `
                <input type="text" placeholder="ชื่อ-นามสกุล" class="c-name shadow-sm border rounded w-full md:w-2/5 py-1 px-2 text-sm text-gray-700">
                <input type="text" placeholder="ตำแหน่ง" class="c-position shadow-sm border rounded w-full md:w-2/5 py-1 px-2 text-sm text-gray-700">
                <select class="c-role shadow-sm border rounded w-full md:w-1/5 py-1 px-2 text-sm text-gray-700">
                    <option value="">-- เลือกประเภท --</option>
                    <option value="ประธานคณะกรรมการ">ประธานคณะกรรมการ</option>
                    <option value="กรรมการ">กรรมการ</option>
                    <option value="ผู้ควบคุมงาน">ผู้ควบคุมงาน</option>
                    <option value="ผู้ช่วยผู้ควบคุมงาน">ผู้ช่วยควบคุมงาน</option>
                </select>
                <button type="button" class="text-red-400 hover:text-red-600 font-bold px-2 remove-c-btn">✕</button>
            `;
            committeeContainer.appendChild(row);
            row.querySelector('.c-name').value = name;
            row.querySelector('.c-position').value = position;
            row.querySelector('.c-role').value = role;
            row.querySelector('.remove-c-btn').addEventListener('click', () =>row.remove());
        }
        addCommitteeBtn.addEventListener('click', () => addCommitteeRow());

        closeModalBtn.addEventListener('click', () => modal.classList.add('hidden'));

        addProjectBtn.addEventListener('click', () => {
            currentEditId = null; 
            currentExistingPhotos = {};
            document.querySelector('#projectModal h3').innerHTML = '<span class="text-2xl">+</span> เพิ่มโครงการใหม่';
            projectForm.reset();
            committeeContainer.innerHTML = ''; addCommitteeRow(); 
            modal.classList.remove('hidden');
        });

        async function editProject(projectId) {
            currentEditId = projectId; 
            document.querySelector('#projectModal h3').innerHTML = '<span class="text-2xl">✏️</span> แก้ไขข้อมูลโครงการ';
            try {
                const { data: project, error } = await supabaseClient.from('doh_projects_v3').select('*').eq('id', projectId).single();
                if (error) throw error;

                document.getElementById('projectName').value = project.project_name || '';
                document.getElementById('fiscalYear').value = project.fiscal_year || '';
                document.getElementById('fundingSource').value = project.funding_source || '';
                document.getElementById('projectStatus').value = project.status || 'รอดำเนินการ';
                document.getElementById('contractNum').value = project.contract_number || '';
                document.getElementById('contractor').value = project.contractor || '';
                document.getElementById('routeNum').value = project.route_number || '';
                document.getElementById('sectionName').value = project.section_name || '';
                document.getElementById('kmRange').value = project.km_range || '';
                
                document.getElementById('planPercent').value = project.plan_percent || 0;
                document.getElementById('actualPercent').value = project.actual_percent || 0;
                document.getElementById('progressPercent').value = project.progress_percent || 0;

                document.getElementById('totalBudget').value = project.total_budget || 0;
                document.getElementById('paidAmount').value = project.paid_amount || 0;
                document.getElementById('projectNotes').value = project.notes || '';

                committeeContainer.innerHTML = '';
                if (project.committee_members && project.committee_members.length > 0) {
                    project.committee_members.forEach(c => addCommitteeRow(c.name, c.position, c.role));
                } else addCommitteeRow();

                currentExistingPhotos = { photo_1: project.photo_1, photo_2: project.photo_2, photo_3: project.photo_3, photo_4: project.photo_4 };
                modal.classList.remove('hidden');
            } catch (err) { alert('โหลดข้อมูลล้มเหลว: ' + err.message); }
        }

        async function uploadImage(fileInputId) {
            const file = document.getElementById(fileInputId).files[0];
            if (!file) return null; 
            const filePath = `progress/${Date.now()}_${Math.random().toString(36).substring(2)}.${file.name.split('.').pop()}`; 
            try {
                const { error } = await supabaseClient.storage.from('project_photos').upload(filePath, file);
                if (error) { alert(`อัปโหลดรูปไม่สำเร็จ: ${error.message}`); return null; }
                return supabaseClient.storage.from('project_photos').getPublicUrl(filePath).data.publicUrl;
            } catch (err) { return null; }
        }
        
        projectForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('saveProjectBtn');
            saveBtn.innerHTML = '⏳ กำลังประมวลผล...'; saveBtn.disabled = true;

            try {
                const p1 = await uploadImage('photo1') || currentExistingPhotos.photo_1 || null;
                const p2 = await uploadImage('photo2') || currentExistingPhotos.photo_2 || null;
                const p3 = await uploadImage('photo3') || currentExistingPhotos.photo_3 || null;
                const p4 = await uploadImage('photo4') || currentExistingPhotos.photo_4 || null;

                const committeeMembers = [];
                document.querySelectorAll('.committee-row').forEach(row => {
                    const name = row.querySelector('.c-name').value.trim();
                    if (name) committeeMembers.push({ name, position: row.querySelector('.c-position').value, role: row.querySelector('.c-role').value });
                });

                const projectData = {
                    project_name: document.getElementById('projectName').value,
                    fiscal_year: document.getElementById('fiscalYear').value,
                    funding_source: document.getElementById('fundingSource').value,
                    status: document.getElementById('projectStatus').value,
                    contract_number: document.getElementById('contractNum').value,
                    contractor: document.getElementById('contractor').value,
                    route_number: document.getElementById('routeNum').value,
                    section_name: document.getElementById('sectionName').value,
                    km_range: document.getElementById('kmRange').value,
                    
                    plan_percent: parseFloat(document.getElementById('planPercent').value) || 0,
                    actual_percent: parseFloat(document.getElementById('actualPercent').value) || 0,
                    progress_percent: parseFloat(document.getElementById('progressPercent').value) || 0,
                    
                    total_budget: parseFloat(document.getElementById('totalBudget').value) || 0,
                    paid_amount: parseFloat(document.getElementById('paidAmount').value) || 0,
                    notes: document.getElementById('projectNotes').value,
                    department_id: userDepartmentId,
                    committee_members: committeeMembers,
                    photo_1: p1, photo_2: p2, photo_3: p3, photo_4: p4
                };

                if (currentEditId) {
                    projectData.has_new_update = (userRole !== 'super_admin'); 
                    // 📌 จุดสำคัญที่ขาดหายไป: ดัก Error ตอน Update
                    const { error } = await supabaseClient.from('doh_projects_v3').update(projectData).eq('id', currentEditId);
                    if (error) throw error;
                    alert('✅ อัปเดตข้อมูลสำเร็จ!');
                } else {
                    projectData.has_new_update = true; 
                    // 📌 จุดสำคัญที่ขาดหายไป: ดัก Error ตอน Insert
                    const { error } = await supabaseClient.from('doh_projects_v3').insert([projectData]);
                    if (error) throw error;
                    alert('✅ เพิ่มโครงการใหม่สำเร็จ!');
                }

                modal.classList.add('hidden'); projectForm.reset(); fetchProjects();
            } catch (err) { alert('เกิดข้อผิดพลาด: ' + err.message); } 
            finally { saveBtn.innerHTML = '💾 บันทึก'; saveBtn.disabled = false; }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut(); window.location.href = 'index.html';
        });

        const viewModal = document.getElementById('viewModal');
        const viewContent = document.getElementById('viewContent');
        document.getElementById('closeViewModalBtn').addEventListener('click', () => viewModal.classList.add('hidden'));

        async function viewProject(projectId) {
            viewModal.classList.remove('hidden');
            viewContent.innerHTML = '<p class="text-center text-gray-500 py-12">⏳ กำลังดึงข้อมูล...</p>';

            try {
                const { data: p, error } = await supabaseClient.from('doh_projects_v3').select('*').eq('id', projectId).single();
                if (error) throw error;

                if (p.has_new_update && userRole === 'super_admin') {
                    await supabaseClient.from('doh_projects_v3').update({ has_new_update: false }).eq('id', projectId);
                    fetchProjects(); 
                }

                let cHTML = '<p class="text-sm text-gray-400">ไม่มีข้อมูลคณะกรรมการ</p>';
                if (p.committee_members?.length > 0) {
                    cHTML = `<div class="overflow-x-auto border rounded-lg"><table class="min-w-full text-xs text-left bg-gray-50"><thead class="bg-gray-100 border-b"><tr><th class="py-2 px-3">ชื่อ-นามสกุล</th><th class="py-2 px-3">ตำแหน่ง</th><th class="py-2 px-3">หน้าที่</th></tr></thead><tbody class="divide-y bg-white">`;
                    p.committee_members.forEach(c => cHTML += `<tr><td class="py-2 px-3 font-medium">${c.name||'-'}</td><td class="py-2 px-3 text-gray-600">${c.position||'-'}</td><td class="py-2 px-3 text-blue-700">${c.role||'-'}</td></tr>`);
                    cHTML += `</tbody></table></div>`;
                }

                let photosHTML = '';
                [p.photo_1, p.photo_2, p.photo_3, p.photo_4].forEach((url, i) => {
                    if (url) photosHTML += `<div class="border rounded-lg overflow-hidden shadow-sm bg-white"><a href="${url}" target="_blank"><img src="${url}" class="w-full h-44 object-cover hover:scale-105 transition"></a><div class="p-2 text-center text-xs font-semibold text-gray-600 bg-gray-50 border-t">รูปที่ ${i+1}</div></div>`;
                    else photosHTML += `<div class="border-2 border-dashed border-gray-200 rounded-lg h-44 flex flex-col items-center justify-center text-gray-400 bg-gray-50"><span class="text-2xl mb-1">📷</span><span class="text-xs">ไม่มีรูปที่ ${i+1}</span></div>`;
                });

                viewContent.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-blue-50/50 p-4 rounded-lg border border-blue-100 mb-6">
                        <div>
                            <span class="text-xs text-gray-500 font-bold">ชื่อโครงการ</span><p class="text-sm font-semibold text-gray-900">${p.project_name||'-'}</p>
                            <span class="text-xs text-gray-500 font-bold mt-2 block">เลขที่สัญญา</span><p class="text-sm text-gray-800">${p.contract_number||'-'}</p>
                        </div>
                        <div>
                            <span class="text-xs text-gray-500 font-bold">ผู้รับจ้าง</span><p class="text-sm text-gray-800">${p.contractor||'-'}</p>
                            <span class="text-xs text-gray-500 font-bold mt-2 block">สายทาง / ช่วงควบคุม</span><p class="text-sm text-gray-800">${p.route_number||'-'} ${p.section_name||''} (${p.km_range||'-'})</p>
                        </div>
                        <div>
                            <span class="text-xs text-gray-500 font-bold">ปีงบประมาณ / แหล่งทุน</span><p class="text-sm text-gray-800">${p.fiscal_year||'-'} (${p.funding_source||'-'})</p>
                            <span class="text-xs text-gray-500 font-bold mt-2 block">สถานะปัจจุบัน</span><span class="inline-block mt-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-white border">${p.status||'-'}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-4 mb-4">
                        <div class="bg-blue-50 border border-blue-200 rounded-2xl p-4 text-center shadow-sm">
                            <span class="text-sm font-bold text-blue-800 block mb-1">แผนงาน</span>
                            <div class="text-2xl md:text-3xl font-black text-blue-600">${p.plan_percent || 0}%</div>
                        </div>
                        <div class="bg-orange-50 border border-orange-200 rounded-2xl p-4 text-center shadow-sm">
                            <span class="text-sm font-bold text-orange-800 block mb-1">ผลงานเดือนนี้</span>
                            <div class="text-2xl md:text-3xl font-black text-orange-600">${p.actual_percent || 0}%</div>
                        </div>
                        <div class="bg-teal-50 border border-teal-200 rounded-2xl p-4 text-center shadow-sm">
                            <span class="text-sm font-bold text-teal-800 block mb-1">ผลงานสะสม</span>
                            <div class="text-2xl md:text-3xl font-black text-teal-600">${p.progress_percent || 0}%</div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div class="bg-purple-50 border border-purple-100 rounded-lg p-3 text-center">
                            <span class="text-xs font-bold text-purple-800">งบประมาณทั้งหมด</span>
                            <div class="text-xl font-bold text-purple-700 mt-1">${Number(p.total_budget||0).toLocaleString()} ฿</div>
                        </div>
                        <div class="bg-amber-50 border border-amber-100 rounded-lg p-3 text-center">
                            <span class="text-xs font-bold text-amber-800">เบิกจ่ายแล้ว</span>
                            <div class="text-xl font-bold text-amber-700 mt-1">${Number(p.paid_amount||0).toLocaleString()} ฿</div>
                        </div>
                    </div>

                    <div class="mb-6"><h4 class="font-bold text-sm text-gray-700 mb-2">👥 คณะกรรมการตรวจรับพัสดุ / ผู้ควบคุมงาน</h4>${cHTML}</div>
                    <div class="mb-6 bg-yellow-50/60 p-3 rounded-lg border border-yellow-100"><h4 class="font-bold text-xs text-yellow-800 mb-1">📝 รายละเอียด / หมายเหตุ</h4><p class="text-sm text-gray-700 whitespace-pre-line">${p.notes||'ไม่มีบันทึกเพิ่มเติม'}</p></div>
                    <div><h4 class="font-bold text-sm text-gray-700 mb-3">📸 รูปภาพความก้าวหน้าหน้างาน</h4><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">${photosHTML}</div></div>
                `;
            } catch (err) { viewContent.innerHTML = `<p class="text-red-500 text-center py-8">เกิดข้อผิดพลาด: ${err.message}</p>`; }
        }

        async function deleteProject(id, name) {
            if (!confirm(`⚠️ ยืนยันการลบโครงการ:\n"${name}"`)) return;
            try {
                const { error } = await supabaseClient.from('doh_projects_v3').delete().eq('id', id);
                if (error) throw error;
                alert('🗑️ ลบโครงการเรียบร้อยแล้ว'); fetchProjects(); 
            } catch (err) { alert('เกิดข้อผิดพลาด: ' + err.message); }
        }

        checkSession();
    </script>
</body>
</html>
